<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Install as /etc/fonts/conf.d/99-adas-grayscale.conf.
     The SPI panel is mounted rotated, so its subpixels do not run horizontally R-G-B.
     Even grayscale anti-aliasing shows as a halo on this RGB565 TN panel, so glyphs are
     rendered aliased with full hinting (the HMI also asks for this via QFont::NoAntialias). -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
