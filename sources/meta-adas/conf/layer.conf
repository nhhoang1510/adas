BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-adas"
BBFILE_PATTERN_meta-adas = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-adas = "10"

LAYERSERIES_COMPAT_meta-adas = "scarthgap"

LAYERDEPENDS_meta-adas = " \
    core \
    raspberrypi \
    openembedded-layer \
    meta-python \
    qt5-layer \
"
